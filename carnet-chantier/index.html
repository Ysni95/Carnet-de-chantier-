<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet de chantier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --bp-bg:#101B27;
    --bp-panel:#17293C;
    --bp-panel-2:#1E3247;
    --bp-grid:rgba(143,179,199,0.09);
    --bp-line:#33506A;
    --bp-text:#F4EFE3;
    --bp-muted:#83A3B6;
    --bp-orange:#E8611F;
    --bp-orange-dark:#B94A16;
    --bp-yellow:#F0B429;
    --bp-red:#D24343;
    --bp-green:#4FA97A;
    --bp-steel:#93A2AC;
    --bp-panel-hex:#17293C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(232,97,31,0.07), transparent 55%),
      linear-gradient(var(--bp-grid) 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg, var(--bp-grid) 1px, transparent 1px) 0 0/40px 40px,
      var(--bp-bg);
    color:var(--bp-text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:1100px;margin:0 auto;}

  @media(prefers-reduced-motion:reduce){
    *{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}
  }
  :focus-visible{outline:2px solid var(--bp-orange);outline-offset:2px;}

  /* ---- bande de danger (élément signature, à petite dose) ---- */
  .hazard{
    background:repeating-linear-gradient(45deg, var(--bp-orange) 0 10px, #1C1204 10px 20px);
    height:6px;border-radius:6px 6px 0 0;
  }

  /* ---- en-tête : plaque de chantier boulonnée ---- */
  .head{
    position:relative;
    background:var(--bp-panel);
    border:1px solid var(--bp-line);
    border-radius:8px;
    padding:22px 26px 20px;
    margin-bottom:30px;
    display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;
    background-image:
      radial-gradient(circle at 14px 14px, rgba(147,162,172,.45) 0 2px, transparent 2.6px),
      radial-gradient(circle at calc(100% - 14px) 14px, rgba(147,162,172,.45) 0 2px, transparent 2.6px),
      radial-gradient(circle at 14px calc(100% - 14px), rgba(147,162,172,.45) 0 2px, transparent 2.6px),
      radial-gradient(circle at calc(100% - 14px) calc(100% - 14px), rgba(147,162,172,.45) 0 2px, transparent 2.6px);
    overflow:hidden;
  }
  .head .hazard{position:absolute;top:0;left:0;right:0;height:6px;border-radius:0;}
  .head-title{display:flex;align-items:center;gap:12px;margin-top:6px;}
  .head h1{
    font-family:'Oswald',sans-serif;font-weight:700;
    font-size:32px;letter-spacing:1px;text-transform:uppercase;margin:0;
    color:var(--bp-text);
  }
  .head .sub{color:var(--bp-muted);font-size:13px;margin-top:6px;margin-left:42px;letter-spacing:.5px;}
  .stamp{
    border:2px solid var(--bp-orange);color:var(--bp-orange);
    font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;
    letter-spacing:2px;text-transform:uppercase;padding:7px 14px;
    transform:rotate(-3deg);border-radius:3px;position:relative;
    box-shadow:0 0 0 3px rgba(232,97,31,0.12);
  }

  /* ---- cartes chiffrées : tôle rivetée ---- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:28px;}
  .card{
    background:var(--bp-panel);border:1px solid var(--bp-line);border-radius:6px;
    padding:16px 18px;position:relative;
    background-image:
      radial-gradient(circle at 10px 10px, rgba(147,162,172,.4) 0 1.8px, transparent 2.3px),
      radial-gradient(circle at calc(100% - 10px) 10px, rgba(147,162,172,.4) 0 1.8px, transparent 2.3px),
      radial-gradient(circle at 10px calc(100% - 10px), rgba(147,162,172,.4) 0 1.8px, transparent 2.3px),
      radial-gradient(circle at calc(100% - 10px) calc(100% - 10px), rgba(147,162,172,.4) 0 1.8px, transparent 2.3px);
    transition:transform .15s ease, border-color .15s ease;
  }
  .card:hover{transform:translateY(-2px);border-color:var(--bp-orange);}
  .card .lbl-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--bp-muted);}
  .card .lbl-row svg{color:var(--bp-muted);opacity:.8;flex-shrink:0;}
  .card .val{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;}
  .card .val.over{color:var(--bp-red);}
  .card .val.ok{color:var(--bp-green);}

  .grid2{display:grid;grid-template-columns:1.1fr 1.4fr;gap:20px;margin-bottom:28px;}
  @media(max-width:820px){.grid2{grid-template-columns:1fr;}}

  /* ---- ticket de dépense : pincé comme sur un tableau de chantier ---- */
  .ticket{
    background:var(--bp-panel);border:1px dashed var(--bp-line);border-radius:6px;padding:22px 20px 20px;
    position:relative;margin-top:16px;
  }
  .ticket::before{
    content:"";position:absolute;top:-15px;left:50%;transform:translateX(-50%);
    width:48px;height:20px;border-radius:4px 4px 9px 9px;
    background:linear-gradient(180deg,#C3CCD2,#7C8A93);
    box-shadow:0 3px 5px rgba(0,0,0,.4);
  }
  .ticket::after{
    content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    width:13px;height:13px;border-radius:50%;
    background:var(--bp-panel);border:2px solid #8C99A3;
  }
  .ticket h2{
    font-family:'Oswald',sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:1.5px;
    margin:0 0 16px;color:var(--bp-orange);display:flex;align-items:center;gap:8px;
  }
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11px;color:var(--bp-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;}
  .field input,.field select{
    width:100%;background:var(--bp-panel-2);border:1px solid var(--bp-line);color:var(--bp-text);
    font-family:'Inter',sans-serif;font-size:14px;padding:9px 10px;border-radius:4px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--bp-orange);box-shadow:0 0 0 3px rgba(232,97,31,0.15);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .add-btn{
    width:100%;background:var(--bp-orange);color:#1C1204;border:none;
    font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:1px;
    padding:12px;border-radius:4px;cursor:pointer;margin-top:6px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background .15s ease, transform .1s ease;
  }
  .add-btn:hover{background:var(--bp-orange-dark);color:var(--bp-text);}
  .add-btn:active{transform:scale(.98);}

  .charts{background:var(--bp-panel);border:1px dashed var(--bp-line);border-radius:6px;padding:20px;}
  .charts h2,.list-section h2{
    font-family:'Oswald',sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:1.5px;
    margin:0 0 14px;color:var(--bp-orange);display:flex;align-items:center;gap:8px;
  }
  .chart-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .chart-tabs button{
    background:var(--bp-panel-2);border:1px solid var(--bp-line);color:var(--bp-muted);
    font-size:12px;padding:7px 13px;border-radius:4px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;
    font-family:'Inter',sans-serif;font-weight:500;transition:all .15s ease;
  }
  .chart-tabs button:hover{border-color:var(--bp-orange);color:var(--bp-text);}
  .chart-tabs button.active{background:var(--bp-orange);border-color:var(--bp-orange);color:#1C1204;font-weight:600;}
  .chart-wrap{position:relative;width:100%;height:280px;}
  @media(max-width:600px){.chart-wrap{height:220px;}}
  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:14px;font-size:12px;color:var(--bp-muted);font-family:'JetBrains Mono',monospace;}
  .legend span.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px;}

  .list-section{background:var(--bp-panel);border:1px dashed var(--bp-line);border-radius:6px;padding:20px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;color:var(--bp-muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;
    padding:8px 10px;border-bottom:1px solid var(--bp-line);
  }
  tbody tr{transition:background .1s ease;}
  tbody td{padding:11px 10px;border-bottom:1px solid rgba(143,179,199,0.1);}
  tbody tr:hover{background:rgba(232,97,31,0.07);}
  .cat-pill{
    display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:10px;font-size:11px;font-weight:500;
  }
  .cat-pill .pill-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .amount{font-family:'JetBrains Mono',monospace;text-align:right;white-space:nowrap;}
  .del-btn{
    background:none;border:1px solid var(--bp-line);color:var(--bp-muted);border-radius:4px;
    padding:6px 8px;cursor:pointer;display:inline-flex;align-items:center;transition:all .15s ease;
  }
  .del-btn:hover{border-color:var(--bp-red);color:var(--bp-red);background:rgba(210,67,67,0.08);}
  .empty{color:var(--bp-muted);font-size:13px;padding:34px 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .empty svg{color:var(--bp-line);}
  .hidden{display:none !important;}

  @media(max-width:600px){
    body{padding:20px 12px 60px;}
    .head{padding:18px 18px 16px;margin-bottom:20px;}
    .head h1{font-size:22px;}
    .head .sub{margin-left:0;margin-top:8px;}
    .head-title{gap:8px;}
    .stamp{font-size:11px;padding:5px 10px;}
    .cards{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
    .card{padding:12px 14px;}
    .card .lbl{font-size:10px;}
    .card .val{font-size:20px;}
    .grid2{gap:14px;margin-bottom:20px;}
    .ticket,.charts,.list-section{padding:16px 14px 14px;}
    .row2{grid-template-columns:1fr;gap:0;}
    .chart-tabs{flex-wrap:wrap;}
    .chart-tabs button{font-size:11px;padding:6px 10px;}
    table{font-size:12px;}
    thead{display:none;}
    tbody tr{
      display:flex;flex-wrap:wrap;gap:4px 10px;padding:11px 4px;
      border-bottom:1px solid rgba(143,179,199,0.15);
    }
    tbody td{padding:2px 0;border-bottom:none;}
    tbody td:nth-child(1){order:1;color:var(--bp-muted);font-family:'JetBrains Mono',monospace;font-size:11px;}
    tbody td:nth-child(2){order:3;flex-basis:100%;font-weight:500;}
    tbody td:nth-child(3){order:2;margin-left:auto;}
    tbody td:nth-child(4){order:5;flex-basis:100%;color:var(--bp-muted);font-size:12px;}
    tbody td:nth-child(5){order:4;font-weight:600;}
    tbody td:nth-child(6){order:6;margin-left:auto;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="hazard"></div>
    <div>
      <div class="head-title">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--bp-orange)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 18.5a8 8 0 0 1 16 0"/>
          <path d="M2 18.5h20"/>
          <path d="M12 4v4.5"/>
        </svg>
        <h1>Carnet de chantier</h1>
      </div>
      <div class="sub">Suivi des dépenses travaux</div>
    </div>
    <div class="stamp" id="dateStamp"></div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="lbl-row">
        <span class="lbl">Total dépensé</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12"/><path d="M6 8h12"/><path d="m6 13 8.5 8"/><path d="M6 13h3"/><path d="M9 13c6.667 0 6.667-10 0-10"/></svg>
      </div>
      <div class="val" id="totalSpent">0 €</div>
    </div>
    <div class="card">
      <div class="lbl-row">
        <span class="lbl">Nombre de dépenses</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>
      </div>
      <div class="val" id="totalCount">0</div>
    </div>
    <div class="card">
      <div class="lbl-row">
        <span class="lbl">Dont matériel</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
      </div>
      <div class="val" id="totalMaterial" style="font-size:20px;color:var(--bp-yellow);">0 €</div>
    </div>
    <div class="card">
      <div class="lbl-row">
        <span class="lbl">Dont main d'œuvre</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3.5 17 6l-8 8-3.5.5.5-3.5 8-8Z"/><path d="M13 6 15 8"/><path d="M4 21v-2a4 4 0 0 1 4-4h1"/><circle cx="6" cy="9" r="2.5"/></svg>
      </div>
      <div class="val" id="totalLabor" style="font-size:20px;color:#e87ba4;">0 €</div>
    </div>
  </div>

  <div class="grid2">
    <div class="ticket">
      <h2>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Nouvelle dépense
      </h2>
      <div class="field">
        <label for="descInput">Description</label>
        <input type="text" id="descInput" placeholder="ex: Sac de ciment x20">
      </div>
      <div class="row2">
        <div class="field">
          <label for="amountInput">Montant (€)</label>
          <input type="number" id="amountInput" placeholder="0.00" min="0" step="0.01">
        </div>
        <div class="field">
          <label for="dateInput">Date</label>
          <input type="date" id="dateInput">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="typeInput">Type</label>
          <select id="typeInput"></select>
        </div>
        <div class="field">
          <label for="catInput">Catégorie</label>
          <select id="catInput"></select>
        </div>
      </div>
      <div class="field" id="supplierField">
        <label for="supplierInput">Fournisseur (optionnel)</label>
        <input type="text" id="supplierInput" placeholder="ex: Brico, Gedimat...">
      </div>
      <div class="field hidden" id="workerField">
        <label for="workerInput">Ouvrier</label>
        <select id="workerInput"></select>
        <input type="text" id="newWorkerInput" class="hidden" placeholder="Nom du nouvel ouvrier" style="margin-top:8px;">
      </div>
      <button class="add-btn" id="addBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Ajouter la dépense
      </button>
    </div>

    <div class="charts">
      <h2>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-6 3 3 5-7"/></svg>
        Répartition des dépenses
      </h2>
      <div class="chart-tabs">
        <button class="active" data-view="overview">Vue d'ensemble</button>
        <button data-view="cat">Par catégorie</button>
        <button data-view="type">Matériel / main d'œuvre</button>
        <button data-view="worker">Par ouvrier</button>
        <button data-view="month">Par mois</button>
      </div>
      <div class="chart-wrap">
        <canvas id="mainChart" role="img" aria-label="Graphique de répartition des dépenses de chantier">Répartition des dépenses par catégorie ou par mois.</canvas>
      </div>
      <div class="legend" id="chartLegend"></div>
    </div>
  </div>

  <div class="list-section">
    <h2>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/></svg>
      Historique des dépenses
    </h2>
    <div id="tableWrap"></div>
  </div>

</div>

<script>
const CATS = [
  {name:'Gros œuvre', color:'#2a78d6'},
  {name:'Charpente / Toiture', color:'#eb6834'},
  {name:'Plomberie', color:'#1baf7a'},
  {name:'Électricité', color:'#eda100'},
  {name:'Chauffage', color:'#e87ba4'},
  {name:'Isolation', color:'#4a3aa7'},
  {name:'Menuiserie', color:'#008300'},
  {name:'Plâtrerie', color:'#9085e9'},
  {name:'Peinture', color:'#e34948'},
  {name:'Carrelage / Sol', color:'#199e70'},
  {name:'Cuisine', color:'#c98500'},
  {name:'Salle de bain', color:'#d55181'},
  {name:'Matériaux', color:'#3987e5'},
  {name:'Main d\'œuvre', color:'#e66767'},
  {name:'Location matériel', color:'#8FA9BA'},
  {name:'Autre', color:'#5F5E5A'}
];

const TYPES = [
  {name:'Matériel', color:'#eda100'},
  {name:'Main d\'œuvre', color:'#e87ba4'},
  {name:'Autre', color:'#8FA9BA'}
];
const typeColor = name => (TYPES.find(t=>t.name===name)||TYPES[TYPES.length-1]).color;

let expenses = [];
let workers = [];
let currentView = 'overview';
let chart = null;

const catColor = name => (CATS.find(c=>c.name===name)||CATS[CATS.length-1]).color;
const PANEL_HEX = '#17293C';

function fmtEUR(n){
  return new Intl.NumberFormat('fr-BE',{style:'currency',currency:'EUR'}).format(n);
}

async function loadData(){
  try{
    const r = await fetch('/.netlify/functions/data?key=expenses');
    const val = await r.json();
    expenses = val || [];
  }catch(e){ expenses = []; }
  render();
}

async function saveExpenses(){
  try{
    await fetch('/.netlify/functions/data?key=expenses', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(expenses)
    });
  }catch(e){ console.error('Erreur de sauvegarde', e); }
}

async function loadWorkers(){
  try{
    const r = await fetch('/.netlify/functions/data?key=workers');
    const val = await r.json();
    workers = val || [];
  }catch(e){ workers = []; }
  populateWorkerSelect();
}

async function saveWorkers(){
  try{
    await fetch('/.netlify/functions/data?key=workers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(workers)
    });
  }catch(e){ console.error('Erreur de sauvegarde ouvriers', e); }
}

function populateWorkerSelect(){
  const sel = document.getElementById('workerInput');
  sel.innerHTML = workers.map(w=>`<option value="${escapeHtml(w)}">${escapeHtml(w)}</option>`).join('')
    + `<option value="__new__">+ Ajouter un nouvel ouvrier…</option>`;
}

function toggleWorkerField(){
  const type = document.getElementById('typeInput').value;
  const supplierField = document.getElementById('supplierField');
  const workerField = document.getElementById('workerField');
  const workerSel = document.getElementById('workerInput');
  const newWorkerInput = document.getElementById('newWorkerInput');
  if(type === "Main d'œuvre"){
    supplierField.classList.add('hidden');
    workerField.classList.remove('hidden');
    if(workers.length === 0){
      workerSel.classList.add('hidden');
      newWorkerInput.classList.remove('hidden');
    }else{
      workerSel.classList.remove('hidden');
      newWorkerInput.classList.toggle('hidden', workerSel.value !== '__new__');
    }
  }else{
    supplierField.classList.remove('hidden');
    workerField.classList.add('hidden');
    newWorkerInput.value = '';
  }
}

function initForm(){
  const sel = document.getElementById('catInput');
  sel.innerHTML = CATS.map(c=>`<option value="${c.name}">${c.name}</option>`).join('');
  const typeSel = document.getElementById('typeInput');
  typeSel.innerHTML = TYPES.map(t=>`<option value="${t.name}">${t.name}</option>`).join('');
  document.getElementById('dateInput').valueAsDate = new Date();
  document.getElementById('dateStamp').textContent = new Date().toLocaleDateString('fr-BE',{day:'2-digit',month:'2-digit',year:'numeric'});
  typeSel.addEventListener('change', toggleWorkerField);
  document.getElementById('workerInput').addEventListener('change', ()=>{
    const v = document.getElementById('workerInput').value;
    document.getElementById('newWorkerInput').classList.toggle('hidden', v !== '__new__');
    if(v === '__new__') document.getElementById('newWorkerInput').focus();
  });
  toggleWorkerField();
}

document.getElementById('addBtn').addEventListener('click', async ()=>{
  const desc = document.getElementById('descInput').value.trim();
  const amount = parseFloat(document.getElementById('amountInput').value);
  const date = document.getElementById('dateInput').value;
  const cat = document.getElementById('catInput').value;
  const type = document.getElementById('typeInput').value;
  let supplier = document.getElementById('supplierInput').value.trim();

  if(!desc || isNaN(amount) || amount <= 0 || !date){
    alert('Merci de renseigner au minimum une description, un montant valide et une date.');
    return;
  }

  if(type === "Main d'œuvre"){
    const workerSel = document.getElementById('workerInput').value;
    const newWorkerVal = document.getElementById('newWorkerInput').value.trim();
    supplier = (workers.length === 0 || workerSel === '__new__') ? newWorkerVal : workerSel;

    if(!supplier){
      alert("Merci de renseigner le nom de l'ouvrier.");
      return;
    }
    if(!workers.includes(supplier)){
      workers.push(supplier);
      await saveWorkers();
      populateWorkerSelect();
    }
  }

  expenses.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    desc, amount, date, cat, type, supplier
  });
  await saveExpenses();

  document.getElementById('descInput').value = '';
  document.getElementById('amountInput').value = '';
  document.getElementById('supplierInput').value = '';
  document.getElementById('newWorkerInput').value = '';
  document.getElementById('dateInput').valueAsDate = new Date();
  toggleWorkerField();

  render();
});

async function deleteExpense(id){
  expenses = expenses.filter(e=>e.id!==id);
  await saveExpenses();
  render();
}

document.querySelectorAll('.chart-tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.chart-tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    renderChart();
  });
});

function render(){
  const total = expenses.reduce((s,e)=>s+e.amount,0);
  document.getElementById('totalSpent').textContent = fmtEUR(total);
  document.getElementById('totalCount').textContent = expenses.length;
  document.getElementById('totalMaterial').textContent = fmtEUR(expenses.filter(e=>e.type==='Matériel').reduce((s,e)=>s+e.amount,0));
  document.getElementById('totalLabor').textContent = fmtEUR(expenses.filter(e=>e.type==='Main d\'œuvre').reduce((s,e)=>s+e.amount,0));

  renderTable();
  renderChart();
}

function renderTable(){
  const wrap = document.getElementById('tableWrap');
  if(expenses.length === 0){
    wrap.innerHTML = `<div class="empty">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/></svg>
      <span>Aucune dépense enregistrée pour le moment.<br>Ajoutez votre premier ticket ci-dessus.</span>
    </div>`;
    return;
  }
  const sorted = [...expenses].sort((a,b)=> b.date.localeCompare(a.date));
  let html = '<table><thead><tr><th>Date</th><th>Description</th><th>Catégorie</th><th>Fournisseur / Ouvrier</th><th style="text-align:right;">Montant</th><th></th></tr></thead><tbody>';
  for(const e of sorted){
    const c = catColor(e.cat);
    html += `<tr>
      <td>${new Date(e.date).toLocaleDateString('fr-BE')}</td>
      <td>${escapeHtml(e.desc)}</td>
      <td><span class="cat-pill" style="background:${c}1F;color:${c};border:1px solid ${c}55;"><span class="pill-dot" style="background:${c};"></span>${escapeHtml(e.cat)}</span></td>
      <td>${escapeHtml(e.supplier||'—')}</td>
      <td class="amount">${fmtEUR(e.amount)}</td>
      <td><button class="del-btn" data-id="${e.id}" aria-label="Supprimer cette dépense">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      </button></td>
    </tr>`;
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;
  wrap.querySelectorAll('.del-btn').forEach(b=>{
    b.addEventListener('click', ()=> deleteExpense(b.dataset.id));
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderChart(){
  const ctx = document.getElementById('mainChart');
  const legend = document.getElementById('chartLegend');

  if(expenses.length === 0){
    if(chart) chart.destroy();
    chart = null;
    legend.innerHTML = '';
    return;
  }

  if(currentView === 'overview'){
    const overview = {};
    for(const e of expenses){
      if(e.type === "Main d'œuvre" && e.supplier){
        const key = 'Ouvrier — ' + e.supplier;
        overview[key] = (overview[key]||0) + e.amount;
      } else {
        overview[e.cat] = (overview[e.cat]||0) + e.amount;
      }
    }
    const labels = Object.keys(overview).sort((a,b)=>overview[b]-overview[a]);
    const data = labels.map(l=>overview[l]);
    const colors = labels.map(l=> l.startsWith('Ouvrier — ') ? '#e87ba4' : catColor(l));
    const total = data.reduce((a,b)=>a+b,0);

    if(chart) chart.destroy();
    chart = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius:4, maxBarThickness:26 }] },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        scales: {
          x: { ticks:{ color:'#83A3B6', callback:(v)=>fmtEUR(v) }, grid:{ color:'rgba(143,179,199,0.1)' } },
          y: { ticks:{ color:'#83A3B6', autoSkip:false }, grid:{ display:false } }
        },
        plugins: { legend:{ display:false }, tooltip:{ callbacks:{
          label:(item)=> ` ${fmtEUR(item.raw)} (${Math.round(item.raw/total*100)}%)`
        }}}
      }
    });

    legend.innerHTML = labels.map((l,i)=>
      `<span><span class="dot" style="background:${colors[i]};"></span>${escapeHtml(l)} — ${fmtEUR(data[i])} (${Math.round(data[i]/total*100)}%)</span>`
    ).join('');

  } else if(currentView === 'cat'){
    const byCat = {};
    for(const e of expenses){ byCat[e.cat] = (byCat[e.cat]||0) + e.amount; }
    const labels = Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]);
    const data = labels.map(l=>byCat[l]);
    const colors = labels.map(catColor);
    const total = data.reduce((a,b)=>a+b,0);

    if(chart) chart.destroy();
    chart = new Chart(ctx, {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor: colors, borderColor: PANEL_HEX, borderWidth: 2 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: {
          label: (item)=> ` ${item.label}: ${fmtEUR(item.raw)} (${Math.round(item.raw/total*100)}%)`
        }}}
      }
    });

    legend.innerHTML = labels.map((l,i)=>
      `<span><span class="dot" style="background:${colors[i]};"></span>${l} — ${fmtEUR(data[i])} (${Math.round(data[i]/total*100)}%)</span>`
    ).join('');

  } else if(currentView === 'type'){
    const byType = {};
    for(const e of expenses){ byType[e.type] = (byType[e.type]||0) + e.amount; }
    const labels = TYPES.map(t=>t.name).filter(n=>byType[n]);
    const data = labels.map(l=>byType[l]);
    const colors = labels.map(typeColor);
    const total = data.reduce((a,b)=>a+b,0);

    if(chart) chart.destroy();
    chart = new Chart(ctx, {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor: colors, borderColor: PANEL_HEX, borderWidth: 2 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: {
          label: (item)=> ` ${item.label}: ${fmtEUR(item.raw)} (${Math.round(item.raw/total*100)}%)`
        }}}
      }
    });

    legend.innerHTML = labels.map((l,i)=>
      `<span><span class="dot" style="background:${colors[i]};"></span>${l} — ${fmtEUR(data[i])} (${Math.round(data[i]/total*100)}%)</span>`
    ).join('');

  } else if(currentView === 'worker'){
    const byWorker = {};
    for(const e of expenses){
      if(e.type === "Main d'œuvre" && e.supplier){ byWorker[e.supplier] = (byWorker[e.supplier]||0) + e.amount; }
    }
    const labels = Object.keys(byWorker).sort((a,b)=>byWorker[b]-byWorker[a]);
    const data = labels.map(l=>byWorker[l]);

    if(chart) chart.destroy();
    if(labels.length === 0){
      chart = null;
      legend.innerHTML = '<span>Aucune dépense de main d\'œuvre enregistrée pour le moment.</span>';
      return;
    }
    chart = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets: [{ label:'Payé', data, backgroundColor:'#e87ba4', borderRadius:4, maxBarThickness:36 }] },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        scales: {
          x: { ticks:{ color:'#83A3B6', callback:(v)=>fmtEUR(v) }, grid:{ color:'rgba(143,179,199,0.1)' } },
          y: { ticks:{ color:'#83A3B6' }, grid:{ display:false } }
        },
        plugins: { legend:{ display:false }, tooltip:{ callbacks:{ label:(item)=> ` ${fmtEUR(item.raw)}` } } }
      }
    });
    legend.innerHTML = labels.map((l,i)=>
      `<span>${escapeHtml(l)} — ${fmtEUR(data[i])}</span>`
    ).join('');

  } else {
    const byMonth = {};
    for(const e of expenses){
      const m = e.date.slice(0,7);
      byMonth[m] = (byMonth[m]||0) + e.amount;
    }
    const months = Object.keys(byMonth).sort();
    const labels = months.map(m=>{
      const [y,mo] = m.split('-');
      return new Date(y, mo-1, 1).toLocaleDateString('fr-BE',{month:'short', year:'2-digit'});
    });
    const data = months.map(m=>byMonth[m]);

    if(chart) chart.destroy();
    chart = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets: [{ label:'Dépenses', data, backgroundColor:'#E8611F', borderRadius:4, maxBarThickness:36 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          y: { ticks:{ color:'#83A3B6', callback:(v)=>fmtEUR(v) }, grid:{ color:'rgba(143,179,199,0.1)' } },
          x: { ticks:{ color:'#83A3B6', autoSkip:false, maxRotation:45 }, grid:{ display:false } }
        },
        plugins: { legend:{ display:false }, tooltip:{ callbacks:{ label:(item)=> ` ${fmtEUR(item.raw)}` } } }
      }
    });
    legend.innerHTML = '';
  }
}

initForm();
loadWorkers();
loadData();
</script>
